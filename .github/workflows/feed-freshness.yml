# External synthetic check for the live feed (docs/monitoring-plan.md, stage 1).
#
# run.sh's healthcheck ping says "the run succeeded on the server" — this probe
# checks what a visitor actually sees: the published items.json is reachable,
# parses, is fresh (<26h — one missed daily run trips it), and is non-empty.
# Catches Caddy/permission/disk failures the internal signal can't.
#
# On failure GitHub emails the workflow actor (Settings → Notifications → Actions).
# Note: public-repo schedules are auto-disabled after 60 days without pushes —
# GitHub mails a warning; re-enable from the Actions tab.
name: feed-freshness

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h; off the hour — on-the-hour crons get delayed
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live feed freshness
        env:
          FEED_URL: https://sungjukim.com/data/items.json
          MAX_AGE_HOURS: 26
        run: |
          node --input-type=module -e '
            const url = process.env.FEED_URL;
            const maxAgeH = Number(process.env.MAX_AGE_HOURS);
            const res = await fetch(url, { headers: { "cache-control": "no-cache" } });
            if (!res.ok) { console.error(`FAIL: HTTP ${res.status} for ${url}`); process.exit(1); }
            const d = await res.json();
            const ageH = (Date.now() - Date.parse(d.generated_at)) / 3600e3;
            console.log(`generated_at=${d.generated_at} age=${ageH.toFixed(1)}h items=${d.items?.length}`);
            if (!Array.isArray(d.items) || d.items.length === 0) { console.error("FAIL: feed has no items"); process.exit(1); }
            if (!Number.isFinite(ageH) || ageH >= maxAgeH) { console.error(`FAIL: feed is stale (>=${maxAgeH}h)`); process.exit(1); }
          '
